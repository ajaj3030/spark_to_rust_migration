# ──────────────────────────────────────────────────────────────
# Vehicle Telemetry Pipeline (Spark → Rust migration) — Configuration
# ──────────────────────────────────────────────────────────────

kafka:
  bootstrap_servers: "localhost:9092"
  # Vehicle-to-cloud telemetry events, keyed by VIN
  topic: "vehicle_telemetry"
  # Per-vehicle latest-state snapshots, keyed by VIN (log-compacted)
  state_topic: "vehicle_state_updates"
  partitions: 8
  # For docker-internal Spark access use kafka:29092
  internal_bootstrap_servers: "kafka:29092"

generator:
  # Target data volume per run (bytes). Default: 5 GB
  target_bytes: 5368709120
  # Records per Kafka produce batch
  batch_size: 10000
  # Number of parallel producer threads (vehicles are sharded across threads
  # so each VIN is always produced by one producer → per-VIN ordering holds)
  num_threads: 4
  # Size of the simulated fleet
  num_vehicles: 2000
  # Estimated bytes per serialized record
  avg_record_bytes: 820

spark:
  app_name: "VehicleTelemetryPipeline"
  master: "spark://spark-master:7077"
  # Structured streaming trigger interval
  trigger_interval: "10 seconds"
  # Checkpoint location inside container
  checkpoint_location: "/opt/checkpoints/vehicle_telemetry"
  # Delta table output path
  delta_output_path: "/opt/delta_output/vehicle_telemetry"
  # Local-mode paths (for running outside Docker)
  local_checkpoint: "./checkpoints/vehicle_telemetry"
  local_delta_output: "./delta_output/vehicle_telemetry"
  # Spark tuning
  shuffle_partitions: 8
  max_offsets_per_trigger: 500000
  # Cluster resources (must match docker-compose.yml)
  worker_cores: 4
  worker_memory: "4g"
  worker_count: 2
  max_cores_per_app: 4
  # Cost model reference (USD / core-hour, Azure HDInsight D4v2 on-demand)
  cost_per_core_hour: 0.752

vehicle_state:
  # Checkpoint location for the vehicle-state upsert stream
  checkpoint_location: "/opt/checkpoints/vehicle_state"
  local_checkpoint: "./checkpoints/vehicle_state"
  # Delta table paths for the vehicle_state table (one row per VIN)
  delta_output_path: "/opt/delta_output/vehicle_state"
  local_delta_output: "./delta_output/vehicle_state"

analytics:
  # Batch analytics jobs (spark_jobs/analytics/) write one Delta table each under here
  output_base: "/opt/delta_output/analytics"
  local_output_base: "./delta_output/analytics"

delta:
  # Local-mode table paths
  table_path: "./delta_output/vehicle_telemetry"
  state_table_path: "./delta_output/vehicle_state"
  # Vacuum retention (hours) — files older than this are eligible for deletion
  vacuum_retention_hours: 168   # 7 days
  # Compact threshold — number of files before triggering compaction
  compact_threshold: 50

rust:
  consumer_group: "rust-vehicle-telemetry-consumer"
  batch_size: 250000
  flush_interval_seconds: 3
  delta_output_path: "/opt/delta_output/vehicle_telemetry_rust"
  local_delta_output: "./delta_output/vehicle_telemetry_rust"
  checkpoint_db: "/opt/checkpoints/rust_vehicle_telemetry/offsets.db"
  local_checkpoint_db: "./checkpoints/rust_vehicle_telemetry/offsets.db"
  state_delta_output_path: "/opt/delta_output/vehicle_state_rust"
  local_state_delta_output: "./delta_output/vehicle_state_rust"
  state_checkpoint_db: "/opt/checkpoints/rust_vehicle_state/offsets.db"
  local_state_checkpoint_db: "./checkpoints/rust_vehicle_state/offsets.db"
  state_consumer_group: "rust-vehicle-state-consumer"
  metrics_file: "/opt/logs/rust_metrics.json"
  state_metrics_file: "/opt/logs/rust_state_metrics.json"

logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s — %(message)s"
