name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # CMake 4 rejects the bundled librdkafka's old cmake_minimum_required
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  rust:
    name: Rust — fmt, clippy, tests (incl. Spark parity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust_pipeline
    steps:
      - uses: actions/checkout@v4
      # The bundled librdkafka build links libcurl on Linux
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_pipeline
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests (ported analytics jobs must match Spark's output on the fixtures)
        run: cargo test

  python:
    name: Python — lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.17.5
      - name: Syntax errors and undefined or unused names
        run: ruff check spark_jobs data_generator dashboard scripts --select E9,F

  scala:
    name: Scala Spark jobs — compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spark_jobs/analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Compile and package (warnings are errors)
        run: sbt -batch package

  kubernetes:
    name: Kubernetes manifests — validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render with kustomize and validate against the Kubernetes schemas
        run: kubectl kustomize deploy/k8s | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -

  image:
    name: Container image — build
    # Release builds are slow; build the image on main only
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: rust_pipeline
          tags: rust-pipeline:${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
